
name: Build and Deploy to AWS ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build Docker and Deploy ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: docker_aws/server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f dockerfile -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition Docker_aws_YT \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Update task definition image
        run: |
          jq --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions |= map(if .name == "Main-server" then .image = $IMAGE else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            task-definition.json > new-task-definition.json

      - name: Register new task definition
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster happy-dog-n43w6w \
            --service Docker_aws_YT-service-la3lmsdr \
            --task-definition "$TASK_DEF_ARN"

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster happy-dog-n43w6w \
            --services Docker_aws_YT-service-la3lmsdr
